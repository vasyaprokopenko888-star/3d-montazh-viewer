<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montazh — FBX</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5;font-family:Arial;color:#1f2937}canvas{display:block}
.p{position:fixed;z-index:5;left:14px;top:14px;background:white;padding:14px;border-radius:14px;box-shadow:0 6px 22px #0002;min-width:330px}
h3{margin:0 0 10px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}button{padding:9px 12px;border:1px solid #cbd5e1;border-radius:9px;background:white;font-size:15px;cursor:pointer}.pri{background:#2563eb;color:white;border-color:#2563eb}
input[type=range]{width:150px}input[type=file]{display:none}.s{font-size:13px;color:#64748b;max-width:380px}
#d{display:none;position:fixed;right:14px;top:14px;z-index:5;background:white;padding:13px;border-radius:12px;box-shadow:0 6px 22px #0002}
</style></head><body>
<canvas id="c"></canvas>
<div class="p"><h3>Montazh — FBX</h3>
<div class="r"><button class="pri" id="bf">📦 Вибрати FBX</button><button id="bt">🖼️ Папка текстур</button></div>
<div class="r">Прозорість <input id="op" type="range" min="0" max="80" value="45"><span id="ov">45%</span></div>
<div class="r"><button id="fit">Показати все</button><button id="clr">Зняти вибір</button></div>
<div id="st" class="s">Вибери FBX, потім папку з текстурами.</div></div>
<div id="d"><b id="dn"></b><div id="dv"></div></div>
<input id="fi" type="file" accept=".fbx"><input id="ti" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,.tga" webkitdirectory multiple>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
const c=document.querySelector('#c'),R=new THREE.WebGLRenderer({canvas:c,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color(0xf1f3f6);
const C=new THREE.PerspectiveCamera(45,1,.01,100000),O=new OrbitControls(C,c);O.enableDamping=true;
S.add(new THREE.HemisphereLight(0xffffff,0x667788,2.2));let L=new THREE.DirectionalLight(0xffffff,2);L.position.set(5,10,7);S.add(L);
let root=null,sel=null,fbx=null,tex=[],urls=[];const st=document.querySelector('#st'),D=document.querySelector('#d');
const ray=new THREE.Raycaster(),m=new THREE.Vector2();
const base=u=>{try{u=decodeURIComponent(u)}catch(e){}return u.replaceAll('\\','/').split('/').pop().toLowerCase()};
const svc=o=>/abf_|minifix|hinge|screw|bolt|drill|holebxf|label/i.test(o?.name||'');
const mats=(o,f)=>o.material&&(Array.isArray(o.material)?o.material:[o.material]).forEach(f);
function opacity(){if(!root)return;let a=1-document.querySelector('#op').value/100;root.traverse(o=>{if(!o.isMesh)return;let x=svc(o)||svc(o.parent);mats(o,z=>{z.transparent=!x;z.opacity=x?1:a;z.depthWrite=x||a>.72;z.needsUpdate=true})});if(sel)hi(sel,true)}
function hi(o,on){o?.traverse(x=>{if(!x.isMesh)return;mats(x,z=>{if(on){if(z.userData.oo===undefined){z.userData.oo=z.opacity;z.userData.ot=z.transparent;if(z.emissive)z.userData.oe=z.emissive.getHex()}z.opacity=1;z.transparent=false;z.depthWrite=true;if(z.emissive)z.emissive.setHex(0xff7800)}else if(z.userData.oo!==undefined){z.opacity=z.userData.oo;z.transparent=z.userData.ot;if(z.emissive)z.emissive.setHex(z.userData.oe||0);delete z.userData.oo;delete z.userData.ot;delete z.userData.oe}z.needsUpdate=true})})}
function clear(){if(sel){hi(sel,false);sel=null;opacity()}D.style.display='none'}
function fit(){if(!root)return;let b=new THREE.Box3().setFromObject(root),s=new THREE.Vector3(),q=new THREE.Vector3();b.getSize(s);b.getCenter(q);let x=Math.max(s.x,s.y,s.z)||1,d=x/(2*Math.tan(THREE.MathUtils.degToRad(C.fov/2)))*1.35;C.near=Math.max(d/10000,.001);C.far=d*100;C.position.copy(q).add(new THREE.Vector3(d*.8,d*.55,d));C.updateProjectionMatrix();O.target.copy(q);O.update()}
function part(x){let p=x,b=x;while(p&&p!==root){if(p.name&&!svc(p)&&!/^mesh\d*$/i.test(p.name)&&!/^group\d*$/i.test(p.name))b=p;p=p.parent}return b}
function show(o){let b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);let rb=new THREE.Box3().setFromObject(root),rs=new THREE.Vector3();rb.getSize(rs);let mx=Math.max(rs.x,rs.y,rs.z),f=mx<20?1000:mx<1000?10:1,v=[s.x*f,s.y*f,s.z*f].sort((a,b)=>b-a);document.querySelector('#dn').textContent=o.name||'Деталь';document.querySelector('#dv').textContent=`${Math.round(v[0])} × ${Math.round(v[1])} × ${Math.round(v[2])} мм`;D.style.display='block'}
async function load(){if(!fbx)return;clear();if(root)S.remove(root);urls.forEach(URL.revokeObjectURL);urls=[];st.textContent='Завантаження FBX…';let map=new Map();for(let f of tex){let u=URL.createObjectURL(f);urls.push(u);map.set(f.name.toLowerCase(),u);map.set(base(f.webkitRelativePath||f.name),u)}
let M=new THREE.LoadingManager();M.setURLModifier(u=>map.get(base(u))||u);
try{let a=await fbx.arrayBuffer();root=new FBXLoader(M).parse(a,'');root.traverse(o=>{if(o.isMesh&&o.material)o.material=Array.isArray(o.material)?o.material.map(x=>x.clone()):o.material.clone()});S.add(root);opacity();fit();let me=0,li=0,la=0,hw=0;root.traverse(o=>{me+=o.isMesh?1:0;li+=(o.isLine||o.isLineSegments)?1:0;la+=/label/i.test(o.name||'')?1:0;hw+=/minifix|hinge|screw|drill|holebxf/i.test(o.name||'')?1:0});st.textContent=`Готово • mesh: ${me} • ліній: ${li} • label: ${la} • фурнітури: ${hw} • текстур: ${tex.length}`}catch(e){console.error(e);st.textContent='Помилка FBX: '+e.message}}
document.querySelector('#bf').onclick=()=>document.querySelector('#fi').click();document.querySelector('#bt').onclick=()=>document.querySelector('#ti').click();
document.querySelector('#fi').onchange=e=>{fbx=e.target.files[0];st.textContent=fbx?'FBX вибрано. Тепер вибери папку текстур.':'FBX не вибрано';if(fbx&&tex.length)load()};
document.querySelector('#ti').onchange=e=>{tex=[...e.target.files];if(fbx)load();else st.textContent=`Текстур вибрано: ${tex.length}. Тепер вибери FBX.`};
document.querySelector('#op').oninput=e=>{document.querySelector('#ov').textContent=e.target.value+'%';opacity()};document.querySelector('#fit').onclick=fit;document.querySelector('#clr').onclick=clear;
c.onpointerdown=e=>{if(!root)return;let r=c.getBoundingClientRect();m.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(m,C);let h=ray.intersectObject(root,true).find(x=>x.object.isMesh);if(!h){clear();return}let p=part(h.object);if(sel===p){clear();return}clear();sel=p;hi(sel,true);show(sel)};
function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function a(){requestAnimationFrame(a);O.update();R.render(S,C)})();
</script></body></html>
