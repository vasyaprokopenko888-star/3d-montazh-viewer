<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montazh — DAE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef1f5;font-family:Arial;color:#1f2937}
canvas{display:block}.p{position:fixed;z-index:10;left:14px;top:14px;background:#fff;padding:14px;border-radius:14px;box-shadow:0 6px 22px #0002;min-width:350px}
h3{margin:0 0 10px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
button{padding:9px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-size:15px;cursor:pointer}
.pri{background:#2563eb;color:#fff;border-color:#2563eb}input[type=file]{display:none}input[type=range]{width:150px}
.s{font-size:13px;color:#64748b;max-width:420px}#info{display:none;position:fixed;z-index:10;right:14px;top:14px;background:#fff;padding:13px;border-radius:12px;box-shadow:0 6px 22px #0002;min-width:220px}
</style>
</head><body>
<canvas id="view"></canvas>
<div class="p"><h3>Montazh — DAE</h3>
<div class="r"><button class="pri" id="openBtn">📂 Відкрити DAE</button></div>
<div class="r">Прозорість <input id="opacity" type="range" min="0" max="80" value="45"><span id="opacityText">45%</span></div>
<div class="r"><button id="fitBtn">Показати все</button><button id="hideBtn">🙈 Приховати панель</button><button id="restoreBtn">👁️ Повернути приховані</button></div>
<div id="status" class="s">Вибираєш тільки DAE. Текстури беруться автоматично з папки textures на сайті.</div></div>
<div id="info"><b id="panelName"></b><div id="panelSize"></div></div>
<input id="daeInput" type="file" accept=".dae">

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ColladaLoader} from 'three/addons/loaders/ColladaLoader.js';

const $=id=>document.getElementById(id);
const canvas=$('view'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf1f3f6);
const camera=new THREE.PerspectiveCamera(45,1,.01,100000);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.2));
const light=new THREE.DirectionalLight(0xffffff,2); light.position.set(5,10,7); scene.add(light);

let model=null, selected=null;
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();

function isService(o){return /abf_|minifix|hinge|screw|bolt|drill|hole|label/i.test(o?.name||'')}
function eachMat(o,fn){if(!o.material)return;(Array.isArray(o.material)?o.material:[o.material]).forEach(fn)}
function cloneMaterials(){model.traverse(o=>{if(o.isMesh&&o.material)o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone()})}
function applyOpacity(){
 if(!model)return;
 const pct=+$('opacity').value, a=1-pct/100; $('opacityText').textContent=pct+'%';
 model.traverse(o=>{if(!o.isMesh)return;const keep=isService(o)||isService(o.parent)||o===selected;
   eachMat(o,m=>{m.transparent=!keep&&pct>0;m.opacity=keep?1:a;m.depthWrite=keep||a>.72;m.side=THREE.DoubleSide;
     if(m.emissive){if(m.userData.baseEm===undefined)m.userData.baseEm=m.emissive.getHex();m.emissive.setHex(o===selected?0xff7800:m.userData.baseEm)}
     m.needsUpdate=true;});
 });
}
function clearSelection(){selected=null;$('info').style.display='none';applyOpacity()}
function fit(){
 if(!model)return;const b=new THREE.Box3().setFromObject(model),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);
 const mx=Math.max(s.x,s.y,s.z)||1,d=mx/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.35;
 camera.near=Math.max(d/10000,.001);camera.far=d*100;camera.position.copy(c).add(new THREE.Vector3(d*.8,d*.55,d));camera.updateProjectionMatrix();controls.target.copy(c);controls.update();
}
function panelFor(mesh){
 let p=mesh,b=mesh;
 while(p&&p!==model){if(p.name&&!isService(p)&&!/^mesh\d*$/i.test(p.name)&&!/^geometry/i.test(p.name))b=p;p=p.parent}
 return b;
}
function showInfo(o){
 const b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);
 const rb=new THREE.Box3().setFromObject(model),rs=new THREE.Vector3();rb.getSize(rs);
 const mx=Math.max(rs.x,rs.y,rs.z),f=mx<20?1000:mx<1000?10:1;
 const v=[s.x*f,s.y*f,s.z*f].sort((a,b)=>b-a);
 $('panelName').textContent='Панель: '+(o.name||'Без назви');
 $('panelSize').innerHTML=`Розмір: <b>${Math.round(v[0])} × ${Math.round(v[1])} × ${Math.round(v[2])} мм</b>`;
 $('info').style.display='block';
}
function texturePath(src){
 let x=src.trim();try{x=decodeURIComponent(x)}catch(e){}
 const name=x.replace(/\\/g,'/').split('/').pop();
 return new URL('textures/'+encodeURIComponent(name),location.href).href;
}
async function loadDAE(file){
 try{
  clearSelection();if(model){scene.remove(model);model=null}
  $('status').textContent='Завантаження DAE…';
  let xml=await file.text();
  let refs=0;
  xml=xml.replace(/<init_from>([\s\S]*?)<\/init_from>/gi,(all,p)=>{refs++;return `<init_from>${texturePath(p)}</init_from>`});
  const result=new ColladaLoader().parse(xml,location.href);
  model=result.scene;cloneMaterials();scene.add(model);applyOpacity();fit();
  let meshes=0,lines=0,labels=0,hardware=0;
  model.traverse(o=>{if(o.isMesh)meshes++;if(o.isLine||o.isLineSegments)lines++;if(/label/i.test(o.name||''))labels++;if(/minifix|hinge|screw|drill|hole/i.test(o.name||''))hardware++});
  $('status').textContent=`Готово • mesh: ${meshes} • ліній: ${lines} • label: ${labels} • фурнітура: ${hardware} • текстури: ${refs}`;
 }catch(e){console.error(e);$('status').textContent='Помилка DAE: '+e.message}
}

$('openBtn').addEventListener('click',()=>$('daeInput').click());
$('daeInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)loadDAE(f)});
$('opacity').addEventListener('input',applyOpacity);
$('fitBtn').addEventListener('click',fit);
$('hideBtn').addEventListener('click',()=>{if(!selected){$('status').textContent='Спочатку вибери панель.';return}selected.visible=false;selected.userData.hiddenByUser=true;selected=null;$('info').style.display='none'});
$('restoreBtn').addEventListener('click',()=>{if(!model)return;let n=0;model.traverse(o=>{if(o.userData.hiddenByUser){o.visible=true;delete o.userData.hiddenByUser;n++}});clearSelection();$('status').textContent='Повернуто панелей: '+n});

canvas.addEventListener('pointerdown',e=>{
 if(!model)return;const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 ray.setFromCamera(mouse,camera);const hit=ray.intersectObject(model,true).find(h=>h.object.isMesh&&!isService(h.object));
 if(!hit){clearSelection();return}const p=panelFor(hit.object);if(selected===p){clearSelection();return}selected=p;applyOpacity();showInfo(p);
});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
