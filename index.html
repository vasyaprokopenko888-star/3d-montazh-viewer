<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montazh DAE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee;font-family:Arial}#bar{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fffffff2;padding:10px 12px;border-radius:10px;box-shadow:0 2px 12px #0002}button{border:0;border-radius:7px;padding:9px 13px;background:#222;color:#fff;font-weight:700;cursor:pointer}input[type=range]{width:145px}#status{font-size:13px;color:#444}#info{position:absolute;z-index:20;right:12px;top:82px;background:#fffffff0;padding:10px 13px;border-radius:8px;display:none;font-size:13px}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="bar"><button id="open">📂 Відкрити DAE + текстури</button><button id="reset">⌂ Вид</button><label>Прозорість <input id="alpha" type="range" min="0" max="80" value="45"> <b id="aval">45%</b></label><span id="status">Вибери DAE та всі JPG/PNG одночасно</span></div>
<input id="files" type="file" accept=".dae,.jpg,.jpeg,.png,.webp" multiple hidden><div id="info"></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{ColladaLoader}from'three/addons/loaders/ColladaLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeeeeee);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,15);scene.add(sun);
let model=null,selected=null;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),status=document.getElementById('status'),info=document.getElementById('info');
function service(o){let p=o;while(p&&p!==model){const n=(p.name||'').toLowerCase();if(n.includes('abf_')||n.includes('minifix')||n.includes('hinge')||n.includes('screw')||n.includes('bolt')||n.includes('hole')||n.includes('label'))return true;p=p.parent}return false}
function cloneMats(){model.traverse(o=>{if(!o.isMesh)return;o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material?.clone()})}
function trans(){if(!model)return;const v=+alpha.value,op=Math.max(.18,1-v/100);aval.textContent=v+'%';model.traverse(o=>{if(!o.isMesh)return;const keep=service(o)||o===selected;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(!m)return;m.transparent=!keep&&v>0;m.opacity=keep?1:op;m.depthWrite=true;m.depthTest=true;m.side=THREE.DoubleSide;if('emissive'in m){if(!m.userData.b)m.userData.b=m.emissive.clone();if(o===selected){m.emissive.setHex(0xff8a00);m.emissiveIntensity=.4}else{m.emissive.copy(m.userData.b);m.emissiveIntensity=1}}m.needsUpdate=true})})}
function fit(){if(!model)return;const b=new THREE.Box3().setFromObject(model),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z)||1,d=mx/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*.7;camera.position.set(c.x+d*.8,c.y-d*.9,c.z+d*.65);camera.near=Math.max(mx/10000,.001);camera.far=mx*100;camera.updateProjectionMatrix();controls.target.copy(c);controls.update()}
function part(mesh){let p=mesh,b=mesh;while(p&&p.parent&&p.parent!==model){const n=(p.name||'').toLowerCase();if(n&&!n.includes('abf_')&&!n.includes('mesh')&&!n.includes('geometry'))b=p;p=p.parent}return b}
function show(o){const s=new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()),d=[s.x,s.y,s.z].map(x=>Math.round(x*1000)).sort((a,b)=>b-a);info.style.display='block';info.innerHTML='<b>'+(o.name||'Деталь')+'</b><br>Розмір: <b>'+d.join(' × ')+' мм</b>'}
async function openProject(fs){const dae=fs.find(f=>f.name.toLowerCase().endsWith('.dae'));if(!dae){status.textContent='DAE не знайдено';return}if(model){scene.remove(model);model=null}selected=null;info.style.display='none';status.textContent='Завантаження…';const urls=new Map();for(const f of fs){if(f===dae)continue;urls.set(f.name,URL.createObjectURL(f))}let xml=await dae.text();xml=xml.replace(/<init_from>([^<]+\.(?:jpg|jpeg|png|webp))<\/init_from>/gi,(all,p)=>{let d=p;try{d=decodeURIComponent(p)}catch{}const base=d.replace(/\\/g,'/').split('/').pop(),u=urls.get(base);return u?'<init_from>'+u+'</init_from>':all});const du=URL.createObjectURL(new Blob([xml],{type:'model/vnd.collada+xml'}));new ColladaLoader().load(du,c=>{model=c.scene;scene.add(model);cloneMats();fit();trans();status.textContent='Відкрито: '+dae.name+' • текстур: '+(fs.length-1);URL.revokeObjectURL(du)},undefined,e=>{console.error(e);status.textContent='Помилка DAE'})}
open.onclick=()=>files.click();files.onchange=e=>openProject([...e.target.files]);reset.onclick=fit;alpha.oninput=trans;
renderer.domElement.addEventListener('pointerdown',e=>{if(!model)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const h=ray.intersectObject(model,true).find(x=>x.object.isMesh&&!service(x.object));if(!h)return;const p=part(h.object);selected=selected===p?null:p;trans();if(selected)show(selected);else info.style.display='none'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
