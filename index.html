<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Монтаж — GLB Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#202124}#app{width:100%;height:100%;position:relative}#toolbar{position:absolute;z-index:10;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.fileLabel{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#222;cursor:pointer;font-size:14px;box-shadow:0 2px 8px #0004}.fileLabel input{display:none}#status{position:absolute;z-index:10;left:12px;bottom:12px;background:#fff;padding:10px 13px;border-radius:10px;box-shadow:0 2px 8px #0004;max-width:calc(100% - 24px)}#info{position:absolute;z-index:10;right:12px;top:62px;width:310px;max-width:calc(100% - 24px);background:#fff;border-radius:12px;padding:14px;box-shadow:0 3px 12px #0005;display:none}#info b{display:block;margin-bottom:6px}.dim{font-size:21px;font-weight:700;margin:8px 0}.small{font-size:13px;color:#666;line-height:1.4}#hint{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;color:#fff8;text-align:center;font-size:18px;pointer-events:none;padding:30px}
</style>
</head>
<body><div id="app">
<div id="toolbar"><label class="fileLabel">📂 Відкрити GLB<input id="file" type="file" accept=".glb"></label><button id="reset">↺ Скинути вигляд</button><button id="transparency">◐ Напівпрозоро</button><button id="labels">🏷 Лейбли</button><button id="overallDims">📐 Габарити</button></div>
<div id="info"></div><div id="hint">Вибери файл <b>.GLB</b>.<br>Крути модель та натискай на деталі.</div><div id="status">Готово. GLB Viewer v2.</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.getElementById('app'), fileInput=document.getElementById('file'), status=document.getElementById('status'), info=document.getElementById('info'), hint=document.getElementById('hint');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf1f1f1);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.001,100000); camera.position.set(2,2,3);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; app.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.08; controls.screenSpacePanning=true; controls.minDistance=.02;
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.4)); scene.add(new THREE.AmbientLight(0xffffff,.9));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(5,8,7); scene.add(key); const fill=new THREE.DirectionalLight(0xffffff,1.3); fill.position.set(-5,4,-6); scene.add(fill);
const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
let model=null, selectedRoot=null, originalMaterials=new Map(), transparentMode=false, downX=0,downY=0, labelsVisible=true, dimsVisible=false;
const helperGroup=new THREE.Group(); scene.add(helperGroup);

function cleanName(name){ if(!name)return 'Без назви'; return name.replace(/^__/,'').replace(/^\d+\._/,'').replace(/_/g,' ').trim(); }
function findDetailRoot(obj){ let p=obj; while(p&&p!==model){ if((p.name||'').startsWith('__')) return p; p=p.parent; } return obj; }
function setTransparency(mat,on){ if(!mat)return; if(Array.isArray(mat)){mat.forEach(m=>setTransparency(m,on));return;} mat.transparent=on; mat.opacity=on?.48:1; mat.depthWrite=!on; mat.needsUpdate=true; }
function applyTransparency(){ if(!model)return; model.traverse(o=>{if(o.isMesh)setTransparency(o.material,transparentMode)}); }

// SimLab GLB із SketchUp зберігає геометрію деталей у дюймах,
// а вузол деталі має масштаб 25.4. Тому беремо локальну геометрію
// та повертаємо масштаб вузла — отримуємо точні міліметри.
function localBoxOfRoot(root){
  root.updateWorldMatrix(true,true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const box=new THREE.Box3().makeEmpty(), tmp=new THREE.Box3(), rel=new THREE.Matrix4();
  let found=false;
  root.traverse(o=>{
    if(!o.isMesh || !o.geometry) return;
    o.geometry.computeBoundingBox(); if(!o.geometry.boundingBox) return;
    rel.multiplyMatrices(inv,o.matrixWorld); tmp.copy(o.geometry.boundingBox).applyMatrix4(rel); box.union(tmp); found=true;
  });
  return found?box:null;
}
function unitFactor(vals){ const m=Math.max(...vals); return m<20?1000:1; }
function getDetailDimensions(root){
  const box=localBoxOfRoot(root); if(!box)return null;
  const s=box.getSize(new THREE.Vector3()); let vals=[Math.abs(s.x),Math.abs(s.y),Math.abs(s.z)];
  const f=unitFactor(vals); vals=vals.map(v=>v*f).sort((a,b)=>b-a); return vals.map(v=>Math.round(v));
}
function getMaterials(root){ const names=new Set(); root.traverse(o=>{if(!o.isMesh)return; const arr=Array.isArray(o.material)?o.material:[o.material]; arr.forEach(m=>{if(m?.name)names.add(m.name.replace(/^\$/,''));});}); return [...names]; }
function clearSelection(){ if(selectedRoot) selectedRoot.traverse(o=>{if(o.isMesh&&originalMaterials.has(o))o.material=originalMaterials.get(o)}); originalMaterials.clear(); selectedRoot=null; info.style.display='none'; }
function selectObject(obj){ const next=findDetailRoot(obj); if(selectedRoot===next){ clearSelection(); status.textContent='Вибір скасовано.'; return; } clearSelection(); selectedRoot=next; selectedRoot.traverse(o=>{if(!o.isMesh)return; originalMaterials.set(o,o.material); const c=Array.isArray(o.material)?o.material.map(x=>x.clone()):o.material.clone(); (Array.isArray(c)?c:[c]).forEach(m=>{if('emissive' in m){m.emissive=new THREE.Color(0xffa000);m.emissiveIntensity=.35;} setTransparency(m,transparentMode);}); o.material=c;});
 const d=getDetailDimensions(selectedRoot), mats=getMaterials(selectedRoot); let html='<b>Вибрана деталь</b><div style="font-size:20px;margin-bottom:8px">'+cleanName(selectedRoot.name)+'</div>';
 if(d) html+='<div class="small">Розмір деталі</div><div class="dim">'+d[0]+' × '+d[1]+' × '+d[2]+' мм</div><div class="small">довжина × ширина × товщина</div>';
 if(mats.length) html+='<div style="margin-top:12px"><b>Матеріал</b><div>'+mats.join('<br>')+'</div></div>'; info.innerHTML=html; info.style.display='block'; status.textContent='Вибрано: '+cleanName(selectedRoot.name); }

function classifyLabels(){
 if(!model)return; model.traverse(o=>{ const n=(o.name||'').toLowerCase(); o.userData.isMountLabel = /label|text|dimension|dim|arrow|номер|деталь/.test(n); });
}
function setLabelsVisible(on){ labelsVisible=on; if(!model)return; model.traverse(o=>{ if(o.userData.isMountLabel) o.visible=on; }); document.getElementById('labels').textContent=on?'🏷 Лейбли: ON':'🏷 Лейбли: OFF'; }
function clearHelpers(){ while(helperGroup.children.length){ const x=helperGroup.children.pop(); x.geometry?.dispose?.(); x.material?.dispose?.(); } }
function makeTextSprite(text){ const c=document.createElement('canvas'); c.width=512;c.height=128;const x=c.getContext('2d');x.font='bold 46px Arial';x.textAlign='center';x.textBaseline='middle';x.fillStyle='white';x.fillRect(0,0,c.width,c.height);x.fillStyle='black';x.fillText(text,c.width/2,c.height/2);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));sp.scale.set(1.8,.45,1);return sp;}
function addDimLine(a,b,label,offset){ const aa=a.clone().add(offset),bb=b.clone().add(offset); const g=new THREE.BufferGeometry().setFromPoints([aa,bb]); const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x111111,depthTest:false}));line.renderOrder=999;helperGroup.add(line); const sp=makeTextSprite(label);sp.position.copy(aa).add(bb).multiplyScalar(.5);helperGroup.add(sp); }
function showOverallDimensions(){ clearHelpers(); if(!model||!dimsVisible)return; const b=new THREE.Box3().setFromObject(model), s=b.getSize(new THREE.Vector3()), min=b.min,max=b.max; let vals=[s.x,s.y,s.z], f=unitFactor(vals); const pad=Math.max(s.x,s.y,s.z)*.06; addDimLine(new THREE.Vector3(min.x,min.y,min.z),new THREE.Vector3(max.x,min.y,min.z),Math.round(s.x*f)+' мм',new THREE.Vector3(0,-pad,-pad)); addDimLine(new THREE.Vector3(min.x,min.y,min.z),new THREE.Vector3(min.x,max.y,min.z),Math.round(s.y*f)+' мм',new THREE.Vector3(-pad,0,-pad)); addDimLine(new THREE.Vector3(min.x,min.y,min.z),new THREE.Vector3(min.x,min.y,max.z),Math.round(s.z*f)+' мм',new THREE.Vector3(-pad,-pad,0)); }
function frameModel(o){ const box=new THREE.Box3().setFromObject(o), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3()), max=Math.max(size.x,size.y,size.z); if(!isFinite(max)||max<=0)return; const dist=max/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*1.05; camera.position.copy(center).add(new THREE.Vector3(dist*.8,dist*.65,dist)); camera.near=Math.max(max/10000,.0001); camera.far=Math.max(max*100,100); camera.updateProjectionMatrix(); controls.target.copy(center); controls.update(); }
function addModel(o){ if(model){scene.remove(model);model.traverse(x=>{if(x.geometry)x.geometry.dispose()})} clearSelection(); model=o; scene.add(model); classifyLabels(); setLabelsVisible(labelsVisible); model.traverse(x=>{if(x.isMesh){x.frustumCulled=true; const arr=Array.isArray(x.material)?x.material:[x.material]; arr.forEach(m=>{if(m?.map)m.map.colorSpace=THREE.SRGBColorSpace; if(m){m.side=THREE.DoubleSide;m.needsUpdate=true;}})}}); applyTransparency(); frameModel(model); hint.style.display='none'; status.textContent='GLB відкрито. Натисни на меблеву деталь.'; }
fileInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;status.textContent='Завантаження: '+f.name;const url=URL.createObjectURL(f);new GLTFLoader().load(url,g=>{addModel(g.scene);URL.revokeObjectURL(url)},undefined,err=>{console.error(err);status.textContent='Помилка відкриття GLB.';URL.revokeObjectURL(url)});});
document.getElementById('labels').onclick=()=>setLabelsVisible(!labelsVisible); document.getElementById('overallDims').onclick=()=>{dimsVisible=!dimsVisible;document.getElementById('overallDims').textContent=dimsVisible?'📐 Габарити: ON':'📐 Габарити';showOverallDimensions();};
renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY}); renderer.domElement.addEventListener('pointerup',e=>{if(!model||Math.hypot(e.clientX-downX,e.clientY-downY)>6)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObject(model,true);if(hits.length)selectObject(hits[0].object);});
document.getElementById('reset').onclick=()=>{if(model)frameModel(model)}; document.getElementById('transparency').onclick=()=>{clearSelection();transparentMode=!transparentMode;applyTransparency();document.getElementById('transparency').textContent=transparentMode?'● Звичайний вигляд':'◐ Напівпрозоро';status.textContent=transparentMode?'Напівпрозорий режим: 48%.':'Звичайний режим.';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}); (function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script></body></html>
