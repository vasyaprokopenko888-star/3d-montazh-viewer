<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Монтаж — GLB Viewer</title>
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#eee}
#app{position:relative}
#toolbar{position:absolute;z-index:20;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}
button,.fileLabel{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#222;cursor:pointer;font-size:14px;box-shadow:0 2px 8px #0004}
.fileLabel input{display:none}
#info{position:absolute;z-index:20;right:12px;top:64px;width:310px;max-width:calc(100% - 24px);background:#fff;border-radius:12px;padding:14px;box-shadow:0 3px 12px #0005;display:none}
#status{position:absolute;z-index:20;left:12px;bottom:12px;background:#fff;padding:9px 12px;border-radius:10px;box-shadow:0 2px 8px #0004;max-width:calc(100% - 24px)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#777;font-size:18px;text-align:center;padding:30px}
.dim{font-size:22px;font-weight:700;margin:8px 0}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="fileLabel">📂 Відкрити GLB<input id="file" type="file" accept=".glb,.gltf"></label>
    <button id="reset">↺ Скинути вигляд</button>
    <div id="opacityControl" style="background:#fff;border-radius:10px;padding:7px 12px;box-shadow:0 2px 8px #0004;display:flex;align-items:center;gap:8px">
      <span>Прозорість:</span>
      <input id="opacity" type="range" min="0" max="100" value="50" step="5" style="width:140px">
      <b id="opacityValue">50%</b>
    </div>
  </div>
  <div id="info"></div>
  <div id="hint">Відкрий файл <b>&nbsp;.GLB&nbsp;</b> і натискай на деталі.</div>
  <div id="status">Готово.</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.getElementById('app');
const fileInput=document.getElementById('file');
const statusEl=document.getElementById('status');
const info=document.getElementById('info');
const hint=document.getElementById('hint');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf1f1f1);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,1000000);
camera.position.set(2,2,3);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.screenSpacePanning=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.5));
const light1=new THREE.DirectionalLight(0xffffff,2.2); light1.position.set(5,8,7); scene.add(light1);
const light2=new THREE.DirectionalLight(0xffffff,1.2); light2.position.set(-5,3,-5); scene.add(light2);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let model=null;
let selectedRoot=null;
let savedMaterials=new Map();
let transparencyPercent=50;
let labelsVisible=true;
let dimensionGroup=null;
let downX=0,downY=0;

function cleanName(name){
  if(!name) return 'Деталь';
  return name.replace(/^__/,'').replace(/^\d+\._?/,'').replace(/_/g,' ').trim() || 'Деталь';
}

function isDetailName(name=''){
  return name.startsWith('__') || /деталь/i.test(name) || /detail/i.test(name);
}

function findDetailRoot(obj){
  let p=obj, fallback=obj;
  while(p && p!==model){
    if(isDetailName(p.name||'')) return p;
    if(p.isGroup || p.isObject3D) fallback=p;
    p=p.parent;
  }
  return fallback;
}

function restoreSelection(){
  if(!selectedRoot) return;
  selectedRoot.traverse(o=>{
    if(o.isMesh && savedMaterials.has(o)){
      o.material=savedMaterials.get(o);
      o.renderOrder=0;
    }
  });
  savedMaterials.clear();
  selectedRoot=null;
  info.style.display='none';
}

function looksLikeLabelObject(o){
  let p=o;
  while(p && p!==model){
    const n=(p.name||'').toLowerCase();
    if(n.includes('label') || n.includes('лейб') || n.includes('text') ||
       n.includes('текст') || n.includes('dimension') || n.includes('розмір')) return true;
    p=p.parent;
  }
  return false;
}

function setTransparency(percent){
  if(!model) return;
  transparencyPercent=percent;
  const t=THREE.MathUtils.clamp(percent/100,0,1);
  // Safe transparency curve: the furniture remains visible even at 100%.
  const opacity=1 - 0.50*Math.pow(t,1.15);

  model.traverse(o=>{
    if(!o.isMesh) return;

    // Labels/text stay fully visible.
    if(looksLikeLabelObject(o)){
      const labelMats=Array.isArray(o.material)?o.material:[o.material];
      labelMats.forEach(m=>{
        if(!m) return;
        m.transparent=false;
        m.opacity=1;
        m.depthWrite=true;
        m.needsUpdate=true;
      });
      return;
    }

    o.renderOrder=0;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{
      if(!m) return;
      m.transparent=percent>0;
      m.opacity=opacity;
      m.depthWrite=true;
      m.depthTest=true;
      m.side=THREE.DoubleSide;
      m.blending=THREE.NormalBlending;
      m.alphaTest=0;
      m.polygonOffset=percent>0;
      m.polygonOffsetFactor=1;
      m.polygonOffsetUnits=1;
      m.needsUpdate=true;
    });
  });
}

function getLocalSize(root){
  root.updateWorldMatrix(true,true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const box=new THREE.Box3();
  let found=false;
  root.traverse(o=>{
    if(!o.isMesh || !o.geometry?.attributes?.position) return;
    const pos=o.geometry.attributes.position;
    const m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    const v=new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v.fromBufferAttribute(pos,i).applyMatrix4(m);
      box.expandByPoint(v);
      found=true;
    }
  });
  if(!found) return null;
  const s=box.getSize(new THREE.Vector3());
  return [Math.abs(s.x),Math.abs(s.y),Math.abs(s.z)];
}

function unitFactor(values){
  const largest=Math.max(...values);
  // GLB/glTF convention is metres. Furniture exported in metres normally has values around 0.018–4.
  if(largest<20) return 1000;
  // Some exporters keep inches.
  if(largest<200) return 25.4;
  return 1;
}

function formatDims(raw){
  if(!raw) return null;
  const f=unitFactor(raw);
  return raw.map(v=>Math.round(v*f)).sort((a,b)=>b-a);
}

function materialNames(root){
  const names=new Set();
  root.traverse(o=>{
    if(!o.isMesh) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{ if(m?.name) names.add(m.name); });
  });
  return [...names].slice(0,4);
}

function selectObject(obj){
  const root=findDetailRoot(obj);
  if(selectedRoot===root){
    restoreSelection();
    statusEl.textContent='Вибір знято.';
    return;
  }
  restoreSelection();
  selectedRoot=root;

  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    savedMaterials.set(o,o.material);
    const source=Array.isArray(o.material)?o.material:[o.material];
    const clones=source.map(m=>{
      const c=m.clone();
      if('emissive' in c){
        c.emissive=new THREE.Color(0xffb347);
        c.emissiveIntensity=.22;
      }
      c.transparent=false;
      c.opacity=1;
      c.depthWrite=true;
      c.depthTest=true;
      c.side=THREE.DoubleSide;
      c.polygonOffset=false;
      return c;
    });
    o.material=Array.isArray(o.material)?clones:clones[0];
    o.renderOrder=100;
  });

  const dims=formatDims(getLocalSize(root));
  const mats=materialNames(root);
  const dimsText=dims?`${dims[0]} × ${dims[1]} × ${dims[2]} мм`:'Розмір не визначено';

  info.innerHTML=`<b>Вибрана деталь</b>
    <div style="font-size:19px;margin-top:5px">${cleanName(root.name)}</div>
    <div class="dim">${dimsText}</div>
    ${mats.length?`<div><b>Матеріал:</b> ${mats.join(', ')}</div>`:''}
    <div class="small" style="margin-top:8px">Повторний клік по цій деталі знімає виділення.</div>`;
  info.style.display='block';
  statusEl.textContent='Вибрано: '+cleanName(root.name);
}

function frameModel(object){
  const box=new THREE.Box3().setFromObject(object);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const maxSize=Math.max(size.x,size.y,size.z)||1;
  const dist=maxSize/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*1.15;
  camera.position.copy(center).add(new THREE.Vector3(dist*.75,dist*.55,dist));
  camera.near=Math.max(maxSize/10000,.001);
  camera.far=Math.max(maxSize*100,1000);
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function makeDimensionText(text, scale){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=512; canvas.height=128;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font='bold 58px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineWidth=8;
  ctx.strokeStyle='rgba(255,255,255,.95)';
  ctx.strokeText(text,256,64);
  ctx.fillStyle='#111';
  ctx.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});
  const sp=new THREE.Sprite(mat);
  sp.renderOrder=10000;
  sp.scale.set(scale*4,scale,1);
  return sp;
}

function lineBetween(a,b){
  const geo=new THREE.BufferGeometry().setFromPoints([a,b]);
  const mat=new THREE.LineBasicMaterial({color:0x222222,depthTest:false,depthWrite:false});
  const line=new THREE.Line(geo,mat);
  line.renderOrder=9999;
  return line;
}

function addDimLine(group,a,b,text,labelPos,textScale){
  group.add(lineBetween(a,b));
  const tick=Math.max(a.distanceTo(b)*0.025,textScale*.22);
  const da=new THREE.Vector3(0,tick,0), db=new THREE.Vector3(0,tick,0);
  group.add(lineBetween(a.clone().sub(da),a.clone().add(da)));
  group.add(lineBetween(b.clone().sub(db),b.clone().add(db)));
  const label=makeDimensionText(text,textScale);
  label.position.copy(labelPos);
  group.add(label);
}

function isLikelyModule(o){
  if(!o || o===model || !o.children || !o.children.length) return false;
  let meshes=0, detailGroups=0;
  o.traverse(x=>{
    if(x.isMesh) meshes++;
    if(x!==o && ((x.name||'').startsWith('__') || /деталь|detail/i.test(x.name||''))) detailGroups++;
  });
  return meshes>=2 && detailGroups>=2;
}

function findModules(){
  // Prefer top-level groups containing several furniture details.
  let candidates=[];
  model.children.forEach(o=>{ if(isLikelyModule(o)) candidates.push(o); });

  // If exporter wrapped everything in one root, inspect one level deeper.
  if(candidates.length<=1){
    const deeper=[];
    model.children.forEach(p=>p.children?.forEach(o=>{ if(isLikelyModule(o)) deeper.push(o); }));
    if(deeper.length>1) candidates=deeper;
  }

  // Remove candidates that almost equal the whole scene and deduplicate nested boxes.
  const whole=new THREE.Box3().setFromObject(model);
  const wholeSize=whole.getSize(new THREE.Vector3());
  const wholeVol=Math.max(wholeSize.x*wholeSize.y*wholeSize.z,1e-12);
  candidates=candidates.filter(o=>{
    const b=new THREE.Box3().setFromObject(o);
    const s=b.getSize(new THREE.Vector3());
    const vol=s.x*s.y*s.z;
    return vol/wholeVol < .92;
  });

  return candidates;
}

function addModuleDimensions(group,obj,index){
  const box=new THREE.Box3().setFromObject(obj);
  if(box.isEmpty()) return;
  const s=box.getSize(new THREE.Vector3());
  const max=Math.max(s.x,s.y,s.z);
  if(max<=0) return;
  const f=unitFactor([s.x,s.y,s.z]);
  const off=max*.055;
  const textScale=max*.045;

  // Width X, below/front
  let a=new THREE.Vector3(box.min.x,box.min.y-off,box.max.z+off*.25);
  let b=new THREE.Vector3(box.max.x,box.min.y-off,box.max.z+off*.25);
  addDimLine(group,a,b,`${Math.round(s.x*f)} мм`,a.clone().add(b).multiplyScalar(.5),textScale);

  // Height Y, left side
  a=new THREE.Vector3(box.min.x-off,box.min.y,box.max.z+off*.25);
  b=new THREE.Vector3(box.min.x-off,box.max.y,box.max.z+off*.25);
  addDimLine(group,a,b,`${Math.round(s.y*f)} мм`,a.clone().add(b).multiplyScalar(.5),textScale);

  // Depth Z, right/bottom
  a=new THREE.Vector3(box.max.x+off*.35,box.min.y-off*.25,box.min.z);
  b=new THREE.Vector3(box.max.x+off*.35,box.min.y-off*.25,box.max.z);
  addDimLine(group,a,b,`${Math.round(s.z*f)} мм`,a.clone().add(b).multiplyScalar(.5),textScale);
}

function clearDimensions(){
  if(!dimensionGroup) return;
  scene.remove(dimensionGroup);
  dimensionGroup.traverse(o=>{
    if(o.material?.map) o.material.map.dispose();
    if(o.material) o.material.dispose();
    if(o.geometry) o.geometry.dispose();
  });
  dimensionGroup=null;
}

function showDimensions(){
  if(!model) return;
  if(dimensionGroup){
    clearDimensions();
    statusEl.textContent='Розміри модулів вимкнено.';
    return;
  }

  const modules=findModules();
  if(!modules.length){
    statusEl.textContent='Не вдалося автоматично визначити окремі модулі в цьому GLB.';
    return;
  }

  dimensionGroup=new THREE.Group();
  dimensionGroup.name='ModuleDimensions';
  modules.forEach((m,i)=>addModuleDimensions(dimensionGroup,m,i));
  scene.add(dimensionGroup);
  statusEl.textContent=`Показано габарити модулів: ${modules.length}.`;
}

function setLabelsVisible(visible){
  if(!model) return;
  model.traverse(o=>{
    const n=(o.name||'').toLowerCase();
    const looksLikeLabel=n.includes('label')||n.includes('лейб')||n.includes('text')||n.includes('текст')||n.includes('dimension');
    if(looksLikeLabel) o.visible=visible;
  });
}

function addModel(obj){
  restoreSelection();
  clearDimensions();
  if(model){
    scene.remove(model);
    model.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  }
  model=obj;
  scene.add(model);
  transparencyPercent=50;
  labelsVisible=true;
  document.getElementById('opacity').value='50';
  document.getElementById('opacityValue').textContent='50%';
  setTransparency(50);
  frameModel(model);
  hint.style.display='none';
  statusEl.textContent='GLB відкрито. Натисни на деталь.';
}

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file) return;
  statusEl.textContent='Завантаження: '+file.name;
  const url=URL.createObjectURL(file);
  new GLTFLoader().load(url,gltf=>{
    addModel(gltf.scene);
    URL.revokeObjectURL(url);
  },undefined,err=>{
    console.error(err);
    statusEl.textContent='Помилка відкриття GLB.';
    URL.revokeObjectURL(url);
  });
});

renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!model || Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(model,true).filter(h=>h.object.visible);
  if(hits.length) selectObject(hits[0].object);
});

document.getElementById('reset').onclick=()=>{if(model) frameModel(model);};
document.getElementById('opacity').addEventListener('input',e=>{
  const value=Number(e.target.value);
  const current=selectedRoot;
  if(current) restoreSelection();
  setTransparency(value);
  if(current){
    let firstMesh=null;
    current.traverse(o=>{ if(!firstMesh && o.isMesh) firstMesh=o; });
    if(firstMesh) selectObject(firstMesh);
  }
  document.getElementById('opacityValue').textContent=value+'%';
  statusEl.textContent=value===0?'Звичайний вигляд.':'Прозорість: '+value+'%.';
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
