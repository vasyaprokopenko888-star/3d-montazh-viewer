<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montazh Pro Viewer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#eee}
#bar{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.95);padding:10px 12px;border-radius:10px;box-shadow:0 2px 12px #0002}
button{border:0;border-radius:7px;padding:9px 13px;background:#222;color:white;font-weight:700;cursor:pointer}
input[type=range]{width:150px}
#status{font-size:13px;color:#444}
.label3d{background:rgba(255,255,255,.88)!important;border:1px solid #111!important}
#info{position:absolute;z-index:15;right:12px;top:82px;background:rgba(255,255,255,.94);padding:9px 12px;border-radius:8px;font-size:13px;display:none}
.label3d{position:absolute;z-index:12;pointer-events:none;transform:translate(-50%,-50%);padding:2px 5px;border:1px solid #222;border-radius:3px;background:rgba(255,255,255,.92);font-size:12px;font-weight:700;color:#111;white-space:nowrap}
canvas{display:block}
</style>
<script type="importmap">
{"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="bar">
<button id="open">📂 Відкрити проєкт</button>
<button id="reset">⌂ Вид</button>
<label>Прозорість <input id="alpha" type="range" min="0" max="80" value="45"> <b id="aval">45%</b></label>
<button id="labelsBtn">Лейбли: ON</button>
<span id="status">Вибери GLB</span>
</div>
<input id="files" type="file" accept=".glb" hidden>
<div id="info"></div><div id="labels"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeeeeee);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(10,20,15);scene.add(dl);

let model=null,selected=null,labels=[],labelsOn=true;
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const status=document.getElementById('status'),info=document.getElementById('info');

function special(o){
 let p=o;
 while(p&&p!==model){
  const n=(p.name||'').toLowerCase();
  if(n.includes('abf_hole')||n.includes('minifix')||n.includes('hinge')||n.includes('screw')||n.includes('bolt')||n.includes('handle'))return true;
  p=p.parent;
 }
 return false;
}
function edges(o){
 if(o.userData.edge)return;
 const l=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,28),new THREE.LineBasicMaterial({color:0x252525,transparent:true,opacity:.65}));
 l.renderOrder=3;o.add(l);o.userData.edge=l;
}
function transparency(){
 if(!model)return;
 const v=+document.getElementById('alpha').value;
 document.getElementById('aval').textContent=v+'%';
 const op=v===0?1:Math.max(.35,1-v/100*.65);
 model.traverse(o=>{
  if(!o.isMesh)return; edges(o);
  const isSelected=(o===selected);
  const isSpecial=special(o)||isSelected;
  const ms=Array.isArray(o.material)?o.material:[o.material];
  ms.forEach(m=>{
   if(!m)return;
   m.transparent=!isSpecial&&v>0;
   m.opacity=isSpecial?1:op;
   m.depthWrite=true;m.depthTest=true;m.side=THREE.DoubleSide;
   if('emissive' in m){
     if(!m.userData._baseEmissive) m.userData._baseEmissive=m.emissive.clone();
     if(isSelected){ m.emissive.setHex(0xffa000); m.emissiveIntensity=.42; }
     else { m.emissive.copy(m.userData._baseEmissive); m.emissiveIntensity=1; }
   }
   m.needsUpdate=true;
  });
  if(o.userData.edge){
    o.userData.edge.material.opacity=isSelected?1:.65;
    o.userData.edge.material.color.setHex(isSelected?0xff7a00:0x252525);
  }
 });
}
function fit(){
 const b=new THREE.Box3().setFromObject(model);if(b.isEmpty())return;
 const c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z);
 const d=m/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.45;
 camera.position.set(c.x+d*.75,c.y+d*.55,c.z+d*.75);controls.target.copy(c);
 camera.near=Math.max(.001,m/10000);camera.far=Math.max(1000,d*20);camera.updateProjectionMatrix();controls.update();
}
function clearLabels(){document.getElementById('labels').innerHTML='';labels=[]}
function niceName(n){
 return (n||'Деталь').replace(/^__\s*/,'').replace(/^\d+\.\s*/,'').replace(/_/g,' ').trim()||'Деталь';
}
function makeLabel(text,obj){
 const el=document.createElement('div');el.className='label3d';el.textContent=text;
 document.getElementById('labels').appendChild(el);
 labels.push({el,obj});
}
function labelsFromGLB(){
 clearLabels();
 if(!model)return;
 const found=new Set();
 model.traverse(o=>{
   if((o.name||'')!=='_ABF_Label')return;
   let p=o.parent, part=null;
   while(p && p!==model){
     const n=p.name||'';
     if(n && n!=='_ABF_Label' && !n.startsWith('_ABF_')){part=p;break}
     p=p.parent;
   }
   if(!part)return;
   const key=part.uuid;
   if(found.has(key))return;
   found.add(key);
   makeLabel(niceName(part.name),o);
 });
}
function updateLabels(){
 const w=innerWidth,h=innerHeight;
 for(const l of labels){
  let wp=new THREE.Vector3();
  if(l.obj) l.obj.getWorldPosition(wp); else if(l.p) wp.copy(l.p);
  const p=wp.project(camera),vis=labelsOn&&p.z>-1&&p.z<1;
  l.el.style.display=vis?'block':'none';
  if(vis){l.el.style.left=((p.x*.5+.5)*w)+'px';l.el.style.top=((-p.y*.5+.5)*h)+'px'}
 }
}
async function openProject(fs){
 const glb=fs.find(f=>f.name.toLowerCase().endsWith('.glb'));
 if(!glb){status.textContent='Не знайдено GLB.';return}
 if(model){scene.remove(model);model=null}
 clearLabels();
 const url=URL.createObjectURL(glb);status.textContent='Завантаження…';
 new GLTFLoader().load(url,g=>{
  model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh)edges(o)});
  labelsFromGLB();fit();transparency();status.textContent=`Відкрито: ${glb.name} • ABF лейблів: ${labels.length}`;URL.revokeObjectURL(url);
 },undefined,e=>{console.error(e);status.textContent='Помилка GLB'});
}
document.getElementById('open').onclick=()=>document.getElementById('files').click();
document.getElementById('files').onchange=e=>openProject([...e.target.files]);
document.getElementById('alpha').oninput=transparency;
document.getElementById('reset').onclick=fit;
document.getElementById('labelsBtn').onclick=e=>{labelsOn=!labelsOn;e.target.textContent='Лейбли: '+(labelsOn?'ON':'OFF')};


function logicalPart(mesh){
 let p=mesh, best=mesh;
 while(p && p.parent && p.parent!==model){
   const n=(p.name||'').toLowerCase();
   if(n && !n.includes('mesh') && !n.includes('primitive')) best=p;
   p=p.parent;
 }
 return best;
}
function showPartInfo(obj){
 const b=new THREE.Box3().setFromObject(obj), sz=b.getSize(new THREE.Vector3());
 const dims=[sz.x,sz.y,sz.z].map(x=>Math.round(x*1000)).sort((a,b)=>b-a);
 info.style.display='block';
 info.innerHTML='<b>'+(obj.name||'Деталь')+'</b><br>'+
   'Розмір: <b>'+dims[0]+' × '+dims[1]+' × '+dims[2]+' мм</b>';
}

renderer.domElement.addEventListener('pointerdown',e=>{
 if(!model)return;
 const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;
 ray.setFromCamera(mouse,camera);const hits=ray.intersectObject(model,true).filter(h=>h.object.isMesh);
 if(!hits.length)return;
 const o=logicalPart(hits[0].object);
 selected=(selected===o)?null:o;transparency();
 if(selected) showPartInfo(selected);
 else info.style.display='none';
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function loop(){requestAnimationFrame(loop);controls.update();updateLabels();renderer.render(scene,camera)})();
</script>
</body></html>
