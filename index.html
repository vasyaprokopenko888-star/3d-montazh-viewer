<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Монтаж — GLB Viewer</title>
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
body{background:#eee}
#app{position:relative}
#toolbar{position:absolute;z-index:20;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}
button,.fileLabel{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#222;cursor:pointer;font-size:14px;box-shadow:0 2px 8px #0004}
.fileLabel input{display:none}
#info{position:absolute;z-index:20;right:12px;top:64px;width:310px;max-width:calc(100% - 24px);background:#fff;border-radius:12px;padding:14px;box-shadow:0 3px 12px #0005;display:none}
#status{position:absolute;z-index:20;left:12px;bottom:12px;background:#fff;padding:9px 12px;border-radius:10px;box-shadow:0 2px 8px #0004;max-width:calc(100% - 24px)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#777;font-size:18px;text-align:center;padding:30px}
.dim{font-size:22px;font-weight:700;margin:8px 0}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="fileLabel">📂 Відкрити GLB<input id="file" type="file" accept=".glb,.gltf"></label>
    <button id="reset">↺ Скинути вигляд</button>
    <div id="opacityControl" style="background:#fff;border-radius:10px;padding:7px 12px;box-shadow:0 2px 8px #0004;display:flex;align-items:center;gap:8px">
      <span>Прозорість:</span>
      <input id="opacity" type="range" min="0" max="85" value="50" step="5" style="width:140px">
      <b id="opacityValue">50%</b>
    </div>
    <button id="labels">🏷 Лейбли: увімк.</button>
    <button id="fasteners">🔩 Кріплення: увімк.</button>
    <button id="dimensions">📐 Габарити</button>
  </div>
  <div id="info"></div>
  <div id="hint">Відкрий файл <b>&nbsp;.GLB&nbsp;</b> і натискай на деталі.</div>
  <div id="status">Готово.</div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app=document.getElementById('app');
const fileInput=document.getElementById('file');
const statusEl=document.getElementById('status');
const info=document.getElementById('info');
const hint=document.getElementById('hint');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf1f1f1);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,1000000);
camera.position.set(2,2,3);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.screenSpacePanning=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.5));
const light1=new THREE.DirectionalLight(0xffffff,2.2); light1.position.set(5,8,7); scene.add(light1);
const light2=new THREE.DirectionalLight(0xffffff,1.2); light2.position.set(-5,3,-5); scene.add(light2);

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let model=null;
let selectedRoot=null;
let savedMaterials=new Map();
let transparencyPercent=50;
let labelsVisible=true;
let dimensionGroup=null;
let labelOverlay=null;
let fastenerOverlay=null;
let fastenersVisible=true;
let downX=0,downY=0;

function cleanName(name){
  if(!name) return 'Деталь';
  return name.replace(/^__/,'').replace(/^\d+\._?/,'').replace(/_/g,' ').trim() || 'Деталь';
}

function isDetailName(name=''){
  return name.startsWith('__') || /деталь/i.test(name) || /detail/i.test(name);
}

function findDetailRoot(obj){
  let p=obj, fallback=obj;
  while(p && p!==model){
    if(isDetailName(p.name||'')) return p;
    if(p.isGroup || p.isObject3D) fallback=p;
    p=p.parent;
  }
  return fallback;
}

function restoreSelection(){
  if(!selectedRoot) return;
  selectedRoot.traverse(o=>{
    if(o.isMesh && savedMaterials.has(o)) o.material=savedMaterials.get(o);
  });
  savedMaterials.clear();
  selectedRoot=null;
  info.style.display='none';
}

function looksLikeLabelObject(o){
  let p=o;
  while(p && p!==model){
    const n=(p.name||'').toLowerCase();
    if(n.includes('label') || n.includes('лейб') || n.includes('text') ||
       n.includes('текст') || n.includes('dimension') || n.includes('розмір') ||
       n.includes('annotation') || n.includes('note') || n.includes('tag')) return true;
    p=p.parent;
  }

  const mats=Array.isArray(o.material)?o.material:[o.material];
  return mats.some(m=>{
    if(!m) return false;
    const n=(m.name||'').toLowerCase();
    return !!m.alphaMap || m.alphaTest>0 ||
      n.includes('label') || n.includes('text') || n.includes('dimension') ||
      n.includes('annotation');
  });
}

function setTransparency(percent){
  if(!model) return;
  transparencyPercent=percent;
  const opacity=Math.max(0.15,1-percent/100);

  model.traverse(o=>{
    if(!o.isMesh) return;

    // Labels/text stay fully visible.
    if(looksLikeLabelObject(o)){
      o.renderOrder=9999;
      const labelMats=Array.isArray(o.material)?o.material:[o.material];
      labelMats.forEach(m=>{
        if(!m) return;
        m.transparent=true;
        m.opacity=1;
        m.depthTest=false;
        m.depthWrite=false;
        m.side=THREE.DoubleSide;
        m.needsUpdate=true;
      });
      return;
    }

    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{
      if(!m) return;
      m.transparent=percent>0;
      m.opacity=opacity;
      m.depthWrite=percent===0;
      m.needsUpdate=true;
    });
  });
}

function getLocalSize(root){
  root.updateWorldMatrix(true,true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert();
  const box=new THREE.Box3();
  let found=false;
  root.traverse(o=>{
    if(!o.isMesh || !o.geometry?.attributes?.position) return;
    const pos=o.geometry.attributes.position;
    const m=new THREE.Matrix4().multiplyMatrices(inv,o.matrixWorld);
    const v=new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      v.fromBufferAttribute(pos,i).applyMatrix4(m);
      box.expandByPoint(v);
      found=true;
    }
  });
  if(!found) return null;
  const s=box.getSize(new THREE.Vector3());
  return [Math.abs(s.x),Math.abs(s.y),Math.abs(s.z)];
}

function unitFactor(values){
  const largest=Math.max(...values);
  // GLB/glTF convention is metres. Furniture exported in metres normally has values around 0.018–4.
  if(largest<20) return 1000;
  // Some exporters keep inches.
  if(largest<200) return 25.4;
  return 1;
}

function formatDims(raw){
  if(!raw) return null;
  const f=unitFactor(raw);
  return raw.map(v=>Math.round(v*f)).sort((a,b)=>b-a);
}

function materialNames(root){
  const names=new Set();
  root.traverse(o=>{
    if(!o.isMesh) return;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{ if(m?.name) names.add(m.name); });
  });
  return [...names].slice(0,4);
}

function selectObject(obj){
  const root=findDetailRoot(obj);
  if(selectedRoot===root){
    restoreSelection();
    statusEl.textContent='Вибір знято.';
    return;
  }
  restoreSelection();
  selectedRoot=root;

  root.traverse(o=>{
    if(!o.isMesh || !o.material) return;
    savedMaterials.set(o,o.material);
    const source=Array.isArray(o.material)?o.material:[o.material];
    const clones=source.map(m=>{
      const c=m.clone();
      if('emissive' in c){
        c.emissive=new THREE.Color(0xffa000);
        c.emissiveIntensity=.5;
      }
      c.transparent=transparencyPercent>0;
      c.opacity=transparencyPercent>0?Math.max(.35,1-transparencyPercent/100):1;
      c.depthWrite=transparencyPercent===0;
      return c;
    });
    o.material=Array.isArray(o.material)?clones:clones[0];
  });

  const dims=formatDims(getLocalSize(root));
  const mats=materialNames(root);
  const dimsText=dims?`${dims[0]} × ${dims[1]} × ${dims[2]} мм`:'Розмір не визначено';

  info.innerHTML=`<b>Вибрана деталь</b>
    <div style="font-size:19px;margin-top:5px">${cleanName(root.name)}</div>
    <div class="dim">${dimsText}</div>
    ${mats.length?`<div><b>Матеріал:</b> ${mats.join(', ')}</div>`:''}
    <div class="small" style="margin-top:8px">Повторний клік по цій деталі знімає виділення.</div>`;
  info.style.display='block';
  statusEl.textContent='Вибрано: '+cleanName(root.name);
}

function frameModel(object){
  const box=new THREE.Box3().setFromObject(object);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const maxSize=Math.max(size.x,size.y,size.z)||1;
  const dist=maxSize/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*1.15;
  camera.position.copy(center).add(new THREE.Vector3(dist*.75,dist*.55,dist));
  camera.near=Math.max(maxSize/10000,.001);
  camera.far=Math.max(maxSize*100,1000);
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function makeTextSprite(text){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const dpr=2;
  ctx.font=`${34*dpr}px Arial`;
  const w=Math.ceil(ctx.measureText(text).width+28*dpr), h=58*dpr;
  canvas.width=w; canvas.height=h;
  ctx.font=`${34*dpr}px Arial`;
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#222'; ctx.lineWidth=2*dpr; ctx.strokeRect(1,1,w-2,h-2);
  ctx.fillStyle='#111'; ctx.textBaseline='middle'; ctx.fillText(text,14*dpr,h/2);
  const tex=new THREE.CanvasTexture(canvas);
  tex.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.SpriteMaterial({map:tex,depthTest:false,depthWrite:false});
  const sp=new THREE.Sprite(mat);
  sp.userData.isDimension=true;
  sp.scale.set(w/h*.12,.12,1);
  return sp;
}

function clearDimensions(){
  if(!dimensionGroup) return;
  scene.remove(dimensionGroup);
  dimensionGroup.traverse(o=>{
    if(o.material?.map) o.material.map.dispose();
    if(o.material) o.material.dispose();
    if(o.geometry) o.geometry.dispose();
  });
  dimensionGroup=null;
}

function showDimensions(){
  if(!model) return;
  if(dimensionGroup){ clearDimensions(); return; }

  const box=new THREE.Box3().setFromObject(model);
  const s=box.getSize(new THREE.Vector3());
  const c=box.getCenter(new THREE.Vector3());
  const f=unitFactor([s.x,s.y,s.z]);
  const labels=[
    {text:`Ш: ${Math.round(s.x*f)} мм`,pos:new THREE.Vector3(c.x,box.min.y-s.y*.08,box.max.z)},
    {text:`В: ${Math.round(s.y*f)} мм`,pos:new THREE.Vector3(box.min.x-s.x*.05,c.y,box.max.z)},
    {text:`Г: ${Math.round(s.z*f)} мм`,pos:new THREE.Vector3(box.max.x,box.min.y-s.y*.08,c.z)}
  ];

  dimensionGroup=new THREE.Group();
  labels.forEach(x=>{const sp=makeTextSprite(x.text);sp.position.copy(x.pos);sp.scale.multiplyScalar(Math.max(s.x,s.y,s.z)*.9);dimensionGroup.add(sp);});
  scene.add(dimensionGroup);
}

function setLabelsVisible(visible){
  if(!model) return;
  model.traverse(o=>{
    const n=(o.name||'').toLowerCase();
    const looksLikeLabel=n.includes('label')||n.includes('лейб')||n.includes('text')||n.includes('текст')||n.includes('dimension');
    if(looksLikeLabel) o.visible=visible;
  });
}


function disposeOverlay(group){
  if(!group) return;
  scene.remove(group);
  group.traverse(o=>{
    if(o.material?.map) o.material.map.dispose();
    if(o.material) o.material.dispose();
    if(o.geometry) o.geometry.dispose();
  });
}

function nearestDetail(obj){
  let p=obj;
  while(p && p!==model){
    if((p.name||'').startsWith('__')) return p;
    p=p.parent;
  }
  return null;
}

function detailNumber(detail){
  const m=(detail?.name||'').match(/^__(\d+)/);
  return m ? m[1] : '';
}

function makeLabelSprite(textValue, worldScale){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=256; canvas.height=128;
  ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.fillRect(10,10,236,108);
  ctx.strokeStyle='#111';
  ctx.lineWidth=7;
  ctx.strokeRect(10,10,236,108);
  ctx.fillStyle='#111';
  ctx.font='bold 72px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(textValue,128,64);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  const material=new THREE.SpriteMaterial({
    map:texture,
    transparent:true,
    depthTest:false,
    depthWrite:false
  });
  const sprite=new THREE.Sprite(material);
  sprite.renderOrder=10000;
  sprite.scale.set(worldScale*1.7,worldScale*.85,1);
  return sprite;
}

function fastenerKind(name){
  const n=(name||'').toLowerCase();
  if(n.includes('minifixbolts')) return 'bolt';
  if(n.includes('minifixplasticbase')) return 'base';
  if(n.includes('hingecup') || n.includes('hingemountingplate')) return 'hinge';
  if(n.includes('screw')) return 'screw';
  if(n.includes('abf_hole') || n.includes('sidedrill')) return 'hole';
  return null;
}

function makeFastenerMarker(kind, size){
  let geometry;
  if(kind==='hinge'){
    geometry=new THREE.TorusGeometry(size*.75,size*.22,10,24);
  } else if(kind==='bolt' || kind==='screw'){
    geometry=new THREE.CylinderGeometry(size*.28,size*.28,size*1.7,14);
  } else if(kind==='base'){
    geometry=new THREE.CylinderGeometry(size*.6,size*.6,size*.38,18);
  } else {
    geometry=new THREE.SphereGeometry(size*.42,14,10);
  }

  const material=new THREE.MeshBasicMaterial({
    color: kind==='hole' ? 0x00a8ff : 0xff7a00,
    transparent:false,
    depthTest:false,
    depthWrite:false,
    side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(geometry,material);
  mesh.renderOrder=9999;
  if(kind==='bolt' || kind==='screw') mesh.rotation.x=Math.PI/2;
  return mesh;
}

function buildMountingOverlays(){
  disposeOverlay(labelOverlay);
  disposeOverlay(fastenerOverlay);
  labelOverlay=new THREE.Group();
  fastenerOverlay=new THREE.Group();
  labelOverlay.name='GeneratedLabels';
  fastenerOverlay.name='GeneratedFasteners';

  model.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(model);
  const modelSize=box.getSize(new THREE.Vector3());
  const maxSize=Math.max(modelSize.x,modelSize.y,modelSize.z)||1;
  const labelSize=maxSize*.022;
  const fastenerSize=maxSize*.0045;

  model.traverse(o=>{
    const name=o.name||'';

    if(name==='_ABF_Label'){
      const detail=nearestDetail(o);
      const num=detailNumber(detail);
      if(num){
        const pos=new THREE.Vector3();
        o.getWorldPosition(pos);
        const sprite=makeLabelSprite(num,labelSize);
        sprite.position.copy(pos);
        labelOverlay.add(sprite);
      }
    }

    const kind=fastenerKind(name);
    if(kind){
      // Avoid duplicate sideDrillDepth markers.
      if(name.toLowerCase().includes('sidedrilldepth')) return;
      const pos=new THREE.Vector3();
      o.getWorldPosition(pos);
      const marker=makeFastenerMarker(kind,fastenerSize);
      marker.position.copy(pos);
      fastenerOverlay.add(marker);
    }
  });

  labelOverlay.visible=labelsVisible;
  fastenerOverlay.visible=fastenersVisible;
  scene.add(labelOverlay);
  scene.add(fastenerOverlay);

  statusEl.textContent=`GLB відкрито. Лейблів: ${labelOverlay.children.length}, кріплень/отворів: ${fastenerOverlay.children.length}.`;
}

function addModel(obj){
  restoreSelection();
  clearDimensions();
  disposeOverlay(labelOverlay); labelOverlay=null;
  disposeOverlay(fastenerOverlay); fastenerOverlay=null;
  if(model){
    scene.remove(model);
    model.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
  }
  model=obj;
  scene.add(model);
  transparencyPercent=50;
  labelsVisible=true;
  document.getElementById('opacity').value='50';
  document.getElementById('opacityValue').textContent='50%';
  document.getElementById('labels').textContent='🏷 Лейбли: увімк.';
  setTransparency(50);
  frameModel(model);
  buildMountingOverlays();
  hint.style.display='none';
}

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file) return;
  statusEl.textContent='Завантаження: '+file.name;
  const url=URL.createObjectURL(file);
  new GLTFLoader().load(url,gltf=>{
    addModel(gltf.scene);
    URL.revokeObjectURL(url);
  },undefined,err=>{
    console.error(err);
    statusEl.textContent='Помилка відкриття GLB.';
    URL.revokeObjectURL(url);
  });
});

renderer.domElement.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!model || Math.hypot(e.clientX-downX,e.clientY-downY)>6) return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(model,true).filter(h=>h.object.visible);
  if(hits.length) selectObject(hits[0].object);
});

document.getElementById('reset').onclick=()=>{if(model) frameModel(model);};
document.getElementById('opacity').addEventListener('input',e=>{
  const value=Number(e.target.value);
  restoreSelection();
  setTransparency(value);
  document.getElementById('opacityValue').textContent=value+'%';
  statusEl.textContent=value===0?'Звичайний вигляд.':'Прозорість: '+value+'%.';
});
document.getElementById('labels').onclick=()=>{
  labelsVisible=!labelsVisible;
  if(labelOverlay) labelOverlay.visible=labelsVisible;
  document.getElementById('labels').textContent=labelsVisible?'🏷 Лейбли: увімк.':'🏷 Лейбли: вимк.';
};

document.getElementById('fasteners').onclick=()=>{
  fastenersVisible=!fastenersVisible;
  if(fastenerOverlay) fastenerOverlay.visible=fastenersVisible;
  document.getElementById('fasteners').textContent=fastenersVisible?'🔩 Кріплення: увімк.':'🔩 Кріплення: вимк.';
};
document.getElementById('dimensions').onclick=showDimensions;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
