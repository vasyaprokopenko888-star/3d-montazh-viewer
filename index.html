<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>3D Монтаж — Viewer v1</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#202124}
    #app{width:100%;height:100%;position:relative}
    #toolbar{
      position:absolute;z-index:10;left:12px;top:12px;right:12px;
      display:flex;gap:8px;align-items:center;flex-wrap:wrap
    }
    button,.fileLabel{
      border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#222;
      cursor:pointer;font-size:14px;box-shadow:0 2px 8px #0004
    }
    .fileLabel input{display:none}
    #status{
      position:absolute;z-index:10;left:12px;bottom:12px;
      background:#fff;padding:10px 13px;border-radius:10px;box-shadow:0 2px 8px #0004;
      max-width:calc(100% - 24px)
    }
    #info{
      position:absolute;z-index:10;right:12px;top:62px;width:270px;max-width:calc(100% - 24px);
      background:#fff;border-radius:12px;padding:14px;box-shadow:0 3px 12px #0005;
      display:none
    }
    #info b{display:block;margin-bottom:6px}
    #hint{
      position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;
      color:#fff8;text-align:center;font-size:18px;pointer-events:none;padding:30px
    }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="fileLabel">📂 Відкрити проєкт
      <input id="file" type="file" accept=".dae">
    </label>
    <button id="reset">↺ Скинути вигляд</button>
    <div style="background:#fff;border-radius:10px;padding:8px 13px;box-shadow:0 2px 8px #0004;display:flex;gap:9px;align-items:center">
      <span>Прозорість:</span>
      <input id="opacity" type="range" min="0" max="80" value="50" step="5" style="width:150px">
      <b id="opacityValue">50%</b>
    </div>
  </div>
  <div id="info"></div>
  <div id="hint">Вибери <b>DAE + PNG/JPG текстури</b> одночасно і відкрий його.<br>Потім крути модель та натискай на деталі.</div>
  <div id="status">Готово. Версія 1.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const fileInput = document.getElementById('file');
const status = document.getElementById('status');
const info = document.getElementById('info');
const hint = document.getElementById('hint');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f4);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100000);
camera.position.set(2,2,3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 0.05;

scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
const dl = new THREE.DirectionalLight(0xffffff, 2.0);
dl.position.set(4,8,6);
scene.add(dl);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let model = null;
let selectedRoot = null;
let originalMaterials = new Map();
let transparencyPercent = 50;

function cleanName(name){
  if(!name) return 'Без назви';
  let s = name.replace(/^__/, '');
  s = s.replace(/^\d+\._/, '');
  s = s.replace(/_/g,' ');
  return s.trim();
}

function findDetailRoot(obj){
  let p = obj;
  while(p){
    const n = p.name || '';
    if(n.startsWith('__')) return p;
    p = p.parent;
  }
  return obj;
}


function setMaterialTransparency(material, percent){
  if(!material) return;
  if(Array.isArray(material)){
    material.forEach(m=>setMaterialTransparency(m, percent));
    return;
  }
  const opacity = Math.max(0.35, 1 - percent/100);
  material.transparent = percent > 0;
  material.opacity = opacity;
  material.depthWrite = percent === 0;
  material.depthTest = true;
  material.side = THREE.DoubleSide;
  material.needsUpdate = true;
}

function applyTransparency(){
  if(!model) return;
  model.traverse(o=>{
    if(o.isMesh) setMaterialTransparency(o.material, transparencyPercent);
  });
}

function clearSelection(){
  if(!selectedRoot) return;
  selectedRoot.traverse(o=>{
    if(o.isMesh && originalMaterials.has(o)){
      o.material = originalMaterials.get(o);
      o.renderOrder=0;
    }
  });
  originalMaterials.clear();
  selectedRoot = null;
  info.style.display='none';
}

function selectObject(obj){
  const nextRoot = findDetailRoot(obj);

  // Повторний клік по тій самій деталі знімає підсвічування.
  if(selectedRoot === nextRoot){
    clearSelection();
    applyTransparency();
    status.textContent='Вибір знято.';
    return;
  }

  clearSelection();
  selectedRoot = nextRoot;

  selectedRoot.traverse(o=>{
    if(o.isMesh){
      originalMaterials.set(o,o.material);
      const m = Array.isArray(o.material) ? o.material.map(x=>x.clone()) : o.material.clone();
      const mats = Array.isArray(m) ? m : [m];
      mats.forEach(mat=>{
        if('emissive' in mat){
          mat.emissive = new THREE.Color(0xffb000);
          mat.emissiveIntensity = 0.28;
        }
        mat.transparent=false;
        mat.opacity=1;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.side=THREE.DoubleSide;
        mat.needsUpdate=true;
      });
      o.material = m;
      o.renderOrder=20;
    }
  });

  const box=new THREE.Box3().setFromObject(selectedRoot);
  const size=box.getSize(new THREE.Vector3());
  const max=Math.max(size.x,size.y,size.z);
  // SketchUp/DAE is commonly exported in meters; detect scale conservatively.
  const factor=max < 20 ? 1000 : 1;
  const dims=[size.x,size.y,size.z].map(v=>Math.round(v*factor)).sort((a,b)=>b-a);

  info.innerHTML =
    '<b>Вибрана деталь</b>'+
    '<div style="font-size:20px;margin-bottom:8px">'+cleanName(selectedRoot.name)+'</div>'+
    '<div style="font-size:17px"><b style="display:inline">Розмір:</b> '+dims[0]+' × '+dims[1]+' × '+dims[2]+' мм</div>'+
    '<div style="margin-top:8px;color:#666">Повторний клік — зняти вибір.</div>';
  info.style.display='block';
  status.textContent = 'Вибрано: ' + cleanName(selectedRoot.name);
}

function frameModel(object){
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxSize = Math.max(size.x,size.y,size.z);
  const distance = maxSize / Math.tan(THREE.MathUtils.degToRad(camera.fov*0.5)) * 1.25;
  camera.position.copy(center).add(new THREE.Vector3(distance,distance,distance));
  camera.near = Math.max(maxSize/10000, 0.001);
  camera.far = Math.max(maxSize*100, 1000);
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function addModel(obj){
  if(model) {
    scene.remove(model);
    model.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
    });
  }
  model=obj;
  scene.add(model);
  clearSelection();
  applyTransparency();
  frameModel(model);
  hint.style.display='none';
  status.textContent='Модель відкрита. Крути її пальцем/мишкою та натискай на деталі.';
}

fileInput.addEventListener('change', async e=>{
  const files=[...e.target.files];
  if(!files.length) return;

  const dae=files.find(f=>f.name.toLowerCase().endsWith('.dae'));
  if(!dae){
    status.textContent='Спочатку вибери DAE разом із файлами текстур.';
    return;
  }

  status.textContent='Завантаження проєкту: '+dae.name;

  // Build a lookup by exact name, decoded name, and relative path.
  const urls=new Map();
  for(const f of files){
    if(f===dae) continue;
    const url=URL.createObjectURL(f);
    urls.set(f.name.toLowerCase(),url);
    if(f.webkitRelativePath){
      urls.set(f.webkitRelativePath.replace(/\\/g,'/').toLowerCase(),url);
    }
  }

  const manager=new THREE.LoadingManager();
  manager.setURLModifier(url=>{
    let clean=url.replace(/\\/g,'/');
    try{ clean=decodeURIComponent(clean); }catch(_){}
    clean=clean.split('?')[0].split('#')[0];

    const lower=clean.toLowerCase();
    const basename=lower.split('/').pop();

    // Exact relative path first, then filename fallback.
    if(urls.has(lower)) return urls.get(lower);
    if(urls.has(basename)) return urls.get(basename);

    // Some DAE exporters prepend a folder named after the project.
    for(const [key,value] of urls){
      if(lower.endsWith('/'+key) || key.endsWith('/'+basename)) return value;
    }
    return url;
  });

  const daeURL=URL.createObjectURL(dae);
  const loader=new ColladaLoader(manager);

  loader.load(daeURL, data=>{
    addModel(data.scene);
    status.textContent='Проєкт відкрито: '+dae.name+'. Текстури підключено: '+urls.size+'.';
    URL.revokeObjectURL(daeURL);
  }, undefined, err=>{
    console.error(err);
    status.textContent='Помилка відкриття DAE.';
    URL.revokeObjectURL(daeURL);
  });
});
renderer.domElement.addEventListener('pointerdown', e=>{
  if(!model) return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(model,true);
  if(hits.length) selectObject(hits[0].object);
});

document.getElementById('reset').onclick=()=>{ if(model) frameModel(model); };

document.getElementById('opacity').addEventListener('input',e=>{
  transparencyPercent=Number(e.target.value);
  document.getElementById('opacityValue').textContent=transparencyPercent+'%';

  const current=selectedRoot;
  if(current) clearSelection();
  applyTransparency();

  status.textContent='Прозорість: '+transparencyPercent+'%.';
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
